name: Release

# Tag-driven: push a `vX.Y.Z` tag matching gradle.properties' `version` to publish.
# Never create the tag/release by hand while this workflow exists - just:
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read properties
        id: props
        run: |
          echo "mod_version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc_version_fabric_1_21_11=$(grep '^minecraft_version=' fabric-1.21.11/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc_version_neoforge_1_21_11=$(grep '^minecraft_version=' neoforge-1.21.11/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "mc_version_neoforge_1_21_1=$(grep '^minecraft_version=' neoforge-1.21.1/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches gradle.properties version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.props.outputs.mod_version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gradle.properties version=${{ steps.props.outputs.mod_version }}" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.props.outputs.mod_version }}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for [${{ steps.props.outputs.mod_version }}] - add one before tagging" >&2
            exit 1
          fi

      - name: Collect release jars
        run: |
          mkdir -p release-assets
          cp fabric-1.21.11/build/libs/*.jar neoforge-1.21.11/build/libs/*.jar neoforge-1.21.1/build/libs/*.jar release-assets/
          rm -f release-assets/*-sources.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fiw Graves ${{ github.ref_name }}"
          body_path: release_notes.md
          files: release-assets/*.jar
          fail_on_unmatched_files: true

      - name: Publish to Modrinth (Fabric 1.21.11)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: fiw-graves
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/fiwgraves-fabric-1.21.11-*.jar
          name: "Fiw Graves ${{ github.ref_name }} (Fabric 1.21.11)"
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release_notes.md
          loaders: fabric
          game-versions: ${{ steps.props.outputs.mc_version_fabric_1_21_11 }}
          java: 21
          dependencies: fabric-api:required

      - name: Publish to Modrinth (NeoForge 1.21.11)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: fiw-graves
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/fiwgraves-neoforge-1.21.11-*.jar
          name: "Fiw Graves ${{ github.ref_name }} (NeoForge 1.21.11)"
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.props.outputs.mc_version_neoforge_1_21_11 }}
          java: 21

      - name: Publish to Modrinth (NeoForge 1.21.1)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: fiw-graves
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/fiwgraves-neoforge-1.21.1-*.jar
          name: "Fiw Graves ${{ github.ref_name }} (NeoForge 1.21.1)"
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.props.outputs.mc_version_neoforge_1_21_1 }}
          java: 21
