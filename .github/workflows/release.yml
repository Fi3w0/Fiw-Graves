name: Release

# Tag-driven: push a `vX.Y.Z` tag matching gradle.properties' `version` to publish.
# Never create the tag/release by hand while this workflow exists - just:
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/player-tests/package-lock.json

      - name: Install pinned player test client
        run: npm ci --prefix .github/player-tests --ignore-scripts

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify loot conservation and restarts on every production jar
        run: |
          source .github/scripts/targets.sh
          VERSION="$(awk -F= '$1 == "version" {print $2}' gradle.properties)"
          for target in "${TARGETS[@]}"; do
            read -r module _ _ <<< "$target"
            python3 .github/scripts/smoke-test.py "$module" "$(jar_path "$module" "$VERSION")" --player-script .github/player-tests/graves.cjs
          done

      - name: Read properties
        id: props
        run: |
          echo "mod_version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches gradle.properties version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.props.outputs.mod_version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gradle.properties version=${{ steps.props.outputs.mod_version }}" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.props.outputs.mod_version }}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for [${{ steps.props.outputs.mod_version }}] - add one before tagging" >&2
            exit 1
          fi

      - name: Collect release jars
        run: |
          VERSION="${{ steps.props.outputs.mod_version }}" bash .github/scripts/collect-jars.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Fiw Graves ${{ github.ref_name }}"
          body_path: release_notes.md
          files: release/*.jar
          fail_on_unmatched_files: true

      - name: Publish every Modrinth target and sync description
        env:
          VERSION: ${{ steps.props.outputs.mod_version }}
          CHANGELOG_FILE: release_notes.md
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/publish-modrinth.sh

      - name: Retain production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graves-verification
          path: |
            build/smoke/**/*.log
            build/smoke/**/snapshots/**
            build/smoke/**/graves-player-state.json
          if-no-files-found: ignore
          retention-days: 14
