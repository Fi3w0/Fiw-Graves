name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric-1.21.11/build/libs/*.jar
            neoforge-1.21.11/build/libs/*.jar
            neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error
