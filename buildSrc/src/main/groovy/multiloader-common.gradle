plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	// project.name is already version-suffixed (e.g. "neoforge-1.21.1") in this monorepo layout.
	archivesName = "${mod_id}-${project.name}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
}

repositories {
	mavenCentral()
	// https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
	exclusiveContent {
		forRepository {
			maven {
				name = 'Sponge'
				url = 'https://repo.spongepowered.org/repository/maven-public'
			}
		}
		filter { includeGroupAndSubgroups('org.spongepowered') }
	}
	exclusiveContent {
		forRepositories(
				maven {
					name = 'ParchmentMC'
					url = 'https://maven.parchmentmc.org/'
				},
				maven {
					name = "NeoForge"
					url = 'https://maven.neoforged.net/releases'
				}
		)
		filter { includeGroup('org.parchmentmc.data') }
	}
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations."$variant".outgoing {
		capability("$group:${project.name}:$version")
		capability("$group:${base.archivesName.get()}:$version")
		capability("$group:$mod_id:$version")
	}
	publishing.publications.configureEach {
		suppressPomMetadataWarningsFor(variant)
	}
}

sourcesJar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_name}" }
	}
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${mod_name}" }
	}

	manifest {
		attributes([
				'Specification-Title'   : mod_name,
				'Specification-Vendor'  : mod_author,
				'Specification-Version' : project.jar.archiveVersion,
				'Implementation-Title'  : project.name,
				'Implementation-Version': project.jar.archiveVersion,
				'Implementation-Vendor' : mod_author,
				'Built-On-Minecraft'    : minecraft_version
		])
	}
}

processResources {
	// Not every module defines every loader's properties (e.g. common-<ver> defines neither
	// fabric_* nor neoforge_*; a loader module only defines its own loader's properties) -
	// only the loader module actually processing mods.toml/fabric.mod.json needs them filled in.
	var expandProps = [
			'version'                      : version,
			'group'                        : project.group,
			'minecraft_version'            : minecraft_version,
			'minecraft_version_range'      : minecraft_version_range,
			'fabric_version'               : findProperty('fabric_version') ?: '',
			'fabric_loader_version'        : findProperty('fabric_loader_version') ?: '',
			'mod_name'                     : mod_name,
			'mod_author'                   : mod_author,
			'mod_id'                       : mod_id,
			'license'                      : license,
			'description'                  : project.description,
			'neoforge_version'             : findProperty('neoforge_version') ?: '',
			'neoforge_loader_version_range': findProperty('neoforge_loader_version_range') ?: '',
			'credits'                      : credits,
			'java_version'                 : java_version
	]

	var jsonExpandProps = expandProps.collectEntries {
		key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
	}

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand expandProps
	}

	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand jsonExpandProps
	}

	inputs.properties(expandProps)
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
}
