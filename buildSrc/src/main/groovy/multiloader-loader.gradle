plugins {
	id 'multiloader-common'
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
}

// Version-suffixed monorepo: each loader module depends on the sibling common module for the
// same Minecraft version (e.g. neoforge-1.21.1 -> common-1.21.1), named by convention.
def commonProjectPath = ":common-${minecraft_version}"

dependencies {
	compileOnly(project(commonProjectPath)) {
		capabilities {
			requireCapability "$group:$mod_id"
		}
		def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
	commonJava project(path: commonProjectPath, configuration: 'commonJava')
	commonResources project(path: commonProjectPath, configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	source(configurations.commonJava)
}

processResources {
	dependsOn(configurations.commonResources)
	from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
	dependsOn(configurations.commonJava)
	from(configurations.commonJava)
	dependsOn(configurations.commonResources)
	from(configurations.commonResources)
}
