plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
	version = "${minecraft_version}-${forge_version}"

	runs {
		configureEach {
			systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
			ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
		}
		// Used only for manual smoke-testing - the shipped mod needs no client-side code.
		client {
			client()
		}
		server {
			server()
		}
	}
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named("$variant") {
		attributes {
			attribute(loaderAttribute, 'forge')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
		configurations.named("$variant") {
			attributes {
				attribute(loaderAttribute, 'forge')
			}
		}
	}
}

jar { manifest { attributes 'MixinConfigs': "${mod_id}.common.mixins.json" } }

// Forge 1.20.1 runs SRG names; the Mixin AP must remap string-based selectors too.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin {
    add sourceSets.main, 'fiwgraves.refmap.json'
    config 'fiwgraves.common.mixins.json'
}

processResources {
    filesMatching('fiwgraves.common.mixins.json') {
        // Prefer the loader's refmap-bearing config over the shared resource copy.
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
