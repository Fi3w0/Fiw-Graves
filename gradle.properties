# Version-suffixed monorepo: MC-version-specific properties (minecraft_version,
# neoforge_version, fabric_version, parchment_*, etc.) live in each module's own
# gradle.properties (e.g. common-1.21.11/gradle.properties), not here.
#
# Every field added here must also be added to
# buildSrc/src/main/groovy/multiloader-common.gradle's expandProps map.

# Project
version=1.2.0
group=com.fiw
java_version=21

# Mod
mod_name=Fiw Graves
mod_author=Fiw
# Technical id used by both loaders. NeoForge/Forge mod ids may not contain hyphens,
# so this must stay hyphen-free even though the project/artifact name uses "fiw-graves".
mod_id=fiwgraves
license=MIT
credits=
description=Death chests without the clutter: ghost markers that live only in packets, a rollback net for griefed loot, and nothing installed on the client.

# Gradle plugins (see root build.gradle)
loom_version=1.16.3
moddev_version=2.0.141

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
