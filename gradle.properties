# Every field added here must also be added to
# buildSrc/src/main/groovy/multiloader-loader.gradle's expandProps map.

# Project
version=1.0.0
group=com.fiw
java_version=21

# Mod
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
mod_name=Fiw Graves
mod_author=Fiw
# Technical id used by both loaders. NeoForge/Forge mod ids may not contain hyphens,
# so this must stay hyphen-free even though the project/artifact name uses "fiw-graves".
mod_id=fiwgraves
license=MIT
credits=
description=Death chests without the clutter: ghost markers that live only in packets, a rollback net for griefed loot, and nothing installed on the client.

# Gradle plugins (see root build.gradle)
loom_version=1.17-SNAPSHOT
moddev_version=2.0.123

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.141.4+1.21.11
fabric_loader_version=0.19.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
## This is the version of minecraft that the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
neoforge_version=21.11.42
neoforge_loader_version_range=[4,)

# Parchment mappings (dev-time only, adds readable parameter names), see
# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
